[project]
name = "inka-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pillow>=11",
  "numpy>=2",
  "pillow-heif>=0.18",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.32",
  "numba>=0.68.0",
]

[project.scripts]
inka-server = "inka_server.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inka_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
